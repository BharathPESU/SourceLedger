version: "3.8"

services:
  # ── PostgreSQL ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sourceledger
      POSTGRES_PASSWORD: sourceledger
      POSTGRES_DB: sourceledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sourceledger"]
      interval: 5s
      timeout: 3s
      retries: 5

